openapi: 3.0.3
info:
  title: GorkyCodeFinal backend
  version: 0.4.0
  description: Teacher API for batches, student submissions and asynchronous grading results.
servers:
  - url: /
paths:
  /health:
    get:
      responses:
        '200': { description: HTTP server is running }
  /ready:
    get:
      responses:
        '200': { description: PostgreSQL, Redis and object storage are available }
        '503': { description: Dependency unavailable }
  /api/v1/auth/login:
    post:
      summary: Teacher login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session created and teacher_session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { description: Invalid request }
        '401': { description: Invalid credentials }
  /api/v1/auth/me:
    get:
      security: [{ teacherSession: [] }]
      responses:
        '200':
          description: Authenticated teacher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { description: Unauthorized }
  /api/v1/auth/logout:
    post:
      responses:
        '204': { description: Session ended }
  /api/v1/batches:
    post:
      summary: Create a grading batch
      security: [{ teacherSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBatchRequest' }
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/batches/{batchId}/pages:
    post:
      summary: Store one page and create or return the student's task in this batch
      security: [{ teacherSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/BatchId' }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: Must equal capture_id in the multipart body.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadPageRequest' }
      responses:
        '202':
          description: Page durably stored; task_id groups pages by the supplied pseudonymous student_id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: Image exceeds configured limit }
        '415': { description: Unsupported image media type }
  /api/v1/batches/{batchId}/close:
    post:
      summary: Close intake and queue only submissions with all expected pages
      security: [{ teacherSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/BatchId' }
      responses:
        '202':
          description: Batch closed; complete tasks queued and incomplete tasks reported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchCloseResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/batches/{batchId}/results:
    get:
      summary: Poll task status changes and completed results
      security: [{ teacherSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/BatchId' }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
          description: Opaque cursor from previous response.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Changes in cursor order; clients correlate rows by task_id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/batches/{batchId}/results/ack:
    post:
      summary: Acknowledge results already persisted by the browser
      security: [{ teacherSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/BatchId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AckResultsRequest' }
      responses:
        '204': { description: Ack recorded; eligible batch data scheduled for cleanup }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/classes:
    get:
      summary: List owned classes
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeacherClass'
                required:
                - items
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      summary: Create class; repeat same UUID and payload safely
      security:
      - teacherSession: []
      responses:
        '201':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherClass'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: &pathid001
                  type: string
                  format: uuid
                name: &pathid002
                  type: string
              required:
              - name
  /api/v1/classes/{classId}/students:
    get:
      summary: List permanent roster; duplicate names are separate UUIDs
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermanentStudent'
                required:
                - items
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: classId
        in: path
        required: true
        schema: *pathid001
    post:
      summary: Add permanent student
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermanentStudent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: classId
        in: path
        required: true
        schema: *pathid001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: *pathid001
                display_name: *pathid002
              required:
              - display_name
  /api/v1/classes/{classId}/students/{studentId}:
    put:
      summary: Correct student display name without merging identities
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermanentStudent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: classId
        in: path
        required: true
        schema: *pathid001
      - name: studentId
        in: path
        required: true
        schema: *pathid001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: *pathid002
              required:
              - display_name
  /api/v1/work-families:
    get:
      summary: List owned assessments
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkFamily'
                required:
                - items
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      summary: Create assessment family
      security:
      - teacherSession: []
      responses:
        '201':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkFamily'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: *pathid001
                title: *pathid002
              required:
              - title
  /api/v1/work-families/{familyId}/variants:
    get:
      summary: List separate persistent variants and confirmed keys
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkVariant'
                required:
                - items
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: familyId
        in: path
        required: true
        schema: *pathid001
    post:
      summary: Save variant; distinct works ID per variant; repeated label must match
        payload
      security:
      - teacherSession: []
      responses:
        '201':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkVariant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: familyId
        in: path
        required: true
        schema: *pathid001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantInput'
  /api/v1/work-families/{familyId}/variants/{workId}/topics:
    put:
      summary: Update future topic mapping; historical snapshots stay unchanged
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkVariant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: familyId
        in: path
        required: true
        schema: *pathid001
      - name: workId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tasks:
                  type: array
                  items:
                    $ref: '#/components/schemas/TopicMapping'
              required:
              - tasks
  /api/v1/available-works:
    get:
      summary: List explicit owned legacy works and keys; no title-based merging
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailableWork'
                required:
                - items
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/classes/{classId}/assignments:
    post:
      summary: Issue family once to a class; further submissions are retakes
      security:
      - teacherSession: []
      responses:
        '201':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: classId
        in: path
        required: true
        schema: *pathid001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                family_id: *pathid001
              required:
              - family_id
  /api/v1/classes/{classId}/journal:
    get:
      summary: Roster by issued assessment, latest terminal submission; no submission
        has empty cell
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassJournal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: classId
        in: path
        required: true
        schema: *pathid001
  /api/v1/students/{studentId}/attempts:
    get:
      summary: All permanent attempts; is_current follows same rule as journal
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: studentId
        in: path
        required: true
        schema: *pathid001
  /api/v1/attempts/{attemptId}:
    get:
      summary: Permanent task answers, evidence and historical metadata after scanner
        cleanup
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermanentAttempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *pathid001
  /api/v1/attempts/{attemptId}/grade:
    put:
      summary: Teacher sets/corrects 2–5 or clears with null; AI never assigns school
        grades
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermanentAttempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *pathid001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grade:
                  type: integer
                  minimum: 2
                  maximum: 5
                  nullable: true
              required:
              - grade
  /api/v1/attempts/{attemptId}/tasks/{taskNumber}/decision:
    put:
      summary: Teacher override wins; null restores original system proposal
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermanentAttempt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: *pathid001
      - name: taskNumber
        in: path
        required: true
        schema: *pathid002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  nullable: true
                  enum:
                  - correct
                  - wrong
                  - null
              required:
              - status
  /api/v1/classes/{classId}/statistics:
    get:
      summary: Latest terminal snapshot with explicit period, denominators, timeline, assistance and retake pairs
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradebookStatistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: classId
        in: path
        required: true
        schema: *pathid001
      - name: from
        in: query
        description: UTC [from,to); latest terminal selection precedes period filtering
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: UTC [from,to); latest terminal selection precedes period filtering
        schema:
          type: string
          format: date-time
      - name: bucket
        in: query
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: week
  /api/v1/students/{studentId}/statistics:
    get:
      summary: Latest terminal snapshot with explicit period, denominators, timeline, assistance and retake pairs
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; response is Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradebookStatistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: studentId
        in: path
        required: true
        schema: *pathid001
      - name: from
        in: query
        description: UTC [from,to); latest terminal selection precedes period filtering
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: UTC [from,to); latest terminal selection precedes period filtering
        schema:
          type: string
          format: date-time
      - name: bucket
        in: query
        schema:
          type: string
          enum:
          - day
          - week
          - month
          default: week
  /api/v1/constructor/editor/:
    get:
      summary: Serve the integrated editor; static app.js/style.css use the same protected prefix
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; Cache-Control: no-store'
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request exceeds 32 MiB
        '422':
          description: Renderer validation failed
        '503':
          description: Renderer unavailable; saved draft preserved
        '504':
          description: Renderer exceeded 180 second timeout; saved draft preserved
  /api/v1/constructor/editor/app.js:
    get:
      summary: Protected constructor editor asset
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; Cache-Control: no-store'
          content:
            text/javascript:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request exceeds 32 MiB
        '422':
          description: Renderer validation failed
        '503':
          description: Renderer unavailable; saved draft preserved
        '504':
          description: Renderer exceeded 180 second timeout; saved draft preserved
  /api/v1/constructor/editor/style.css:
    get:
      summary: Protected constructor editor asset
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; Cache-Control: no-store'
          content:
            text/css:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request exceeds 32 MiB
        '422':
          description: Renderer validation failed
        '503':
          description: Renderer unavailable; saved draft preserved
        '504':
          description: Renderer exceeded 180 second timeout; saved draft preserved
  /api/v1/constructor/capabilities:
    get:
      summary: Renderer capabilities; no secrets exposed
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; Cache-Control: no-store'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Request exceeds 32 MiB
        '422':
          description: Renderer validation failed
        '503':
          description: Renderer unavailable; saved draft preserved
        '504':
          description: Renderer exceeded 180 second timeout; saved draft preserved
  /api/v1/constructor/examples:
    get:
      summary: Renderer examples; no secrets exposed
      security:
      - teacherSession: []
      responses:
        '200':
          description: 'Success; Cache-Control: no-store'
          content:
            application/json:
