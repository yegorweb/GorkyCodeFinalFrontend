components:
  securitySchemes:
    teacherSession: { type: apiKey, in: cookie, name: teacher_session }
  parameters:
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: State conflict or idempotency key reused with different payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
    CreateBatchRequest:
      type: object
      required: [assignment_id, variant, template_id, template_version, expected_student_count, expected_page_count]
      properties:
        class_id: { type: string, format: uuid, description: "Provide with work_id for permanent gradebook; omit both for legacy mode." }
        work_id: { type: integer, format: int64, minimum: 1 }
        assignment_id: { type: string, minLength: 1, maxLength: 100 }
        variant: { type: string, minLength: 1, maxLength: 20 }
        template_id: { type: string, minLength: 1, maxLength: 100, description: Printed Test Studio template ID encoded in the QR; not the scanner geometry ID. }
        template_version: { type: integer, minimum: 1, description: Numeric printed Test Studio revision; scanner geometry version is local to the browser. }
        expected_student_count: { type: integer, minimum: 1, maximum: 1000 }
        expected_page_count: { type: integer, minimum: 1, maximum: 100 }
    Batch:
      type: object
      required: [batch_id, status, created_at]
      properties:
        batch_id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, CLOSED, PROCESSING, COMPLETED, CLOSED_INCOMPLETE, CLEANING, CLEANED] }
        created_at: { type: string, format: date-time }
    UploadPageRequest:
      type: object
      required: [image, capture_id, page_id, page_number, template_id, template_version]
      properties:
        image: { type: string, format: binary }
        capture_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid, description: "Optional legacy grouping ID. For a standalone photograph the backend uses capture_id; no student data is required." }
        display_name: { type: string, minLength: 1, maxLength: 200, description: "Optional legacy display label. Defaults to Работа for a standalone photograph." }
        page_id: { type: string, format: uuid }
        page_number: { type: integer, minimum: 1 }
        template_id: { type: string, minLength: 1, maxLength: 100, description: Printed Test Studio template ID for this batch. }
        template_version: { type: integer, minimum: 1, description: Numeric printed Test Studio revision for this batch. }
        qr_raw: { type: string, maxLength: 8192, description: "Optional exact decoded QR text. New printed QR is B1:{template_id}:{revision}:{page_number}; legacy B1:{template_id}:{page_number} denotes revision 16. The browser validates recognized QR values against this upload; unknown values may remain opaque." }
    PageReceipt:
      type: object
      required: [task_id, page_id, capture_id, status, received_pages, expected_pages]
      properties:
        task_id: { type: string, format: uuid }
        page_id: { type: string, format: uuid }
        capture_id: { type: string, format: uuid }
        status: { type: string, enum: [RECEIVING, QUEUED] }
        received_pages: { type: integer, minimum: 1 }
        expected_pages: { type: integer, minimum: 1 }
    BatchCloseResult:
      type: object
      required: [batch_id, status, queued_tasks, incomplete_tasks, missing_student_count]
      properties:
        batch_id: { type: string, format: uuid }
        status: { type: string, enum: [CLOSED, CLOSED_INCOMPLETE, PROCESSING] }
        queued_tasks: { type: integer, minimum: 0 }
        missing_student_count: { type: integer, minimum: 0, description: Expected students without any submitted page. A positive value requires explicit teacher acknowledgement before server cleanup. }
        incomplete_tasks:
          type: array
          items:
            type: object
            required: [task_id, missing_page_numbers]
            properties:
              task_id: { type: string, format: uuid }
              missing_page_numbers: { type: array, items: { type: integer, minimum: 1 } }
    ResultPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items:
          type: array
          items:
            type: object
            required: [task_id, student_id, status, updated_at]
            properties:
              task_id: { type: string, format: uuid }
              student_id: { type: string, format: uuid }
              display_name: { type: string, maxLength: 200 }
              status: { type: string, enum: [RECEIVING, QUEUED, PROCESSING, SUCCEEDED, FAILED, INCOMPLETE] }
              result: { type: object, additionalProperties: true }
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
                  details: { type: object, additionalProperties: true }
              updated_at: { type: string, format: date-time }
        next_cursor: { type: string, maxLength: 512 }
        has_more: { type: boolean }
    AckResultsRequest:
      type: object
      required: [task_ids, acknowledge_missing_students]
      properties:
        task_ids:
          type: array
          minItems: 0
          items: { type: string, format: uuid }
        acknowledge_missing_students: { type: boolean, description: Must be true when the closed batch reports missing_student_count greater than zero. }

    TeacherClass:
      type: object
      properties:
        id: &id001
          type: string
          format: uuid
        name: &id002
          type: string
        created_at: &id003
          type: string
          format: date-time
      required:
      - id
      - name
      - created_at
    PermanentStudent:
      type: object
      properties:
        id: *id001
        class_id: *id001
        display_name: *id002
        created_at: *id003
      required:
      - id
      - class_id
      - display_name
      - created_at
    WorkFamily:
      type: object
      properties:
        id: *id001
        title: *id002
        created_at: *id003
      required:
      - id
      - title
      - created_at
    CatalogTask:
      type: object
      properties:
        task_number: *id002
        topic: &id005
          type: string
          nullable: true
        text: *id002
        answer: *id002
        answer_type:
          type: string
          enum:
          - number
          - sequence
          - choice_set
          - matching
          - true_false
          - text
      required:
      - task_number
      - text
      - answer
      - answer_type
    WorkVariant:
      type: object
      properties:
        work_id: &id004
          type: integer
          format: int64
        family_id: *id001
        title: *id002
        assignment_id: *id002
        variant:
          type: string
          pattern: ^[0-9]+$
        template_id: *id002
        template_version:
          type: integer
          minimum: 1
        expected_page_count:
          type: integer
          minimum: 1
          maximum: 100
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/CatalogTask'
      required:
      - work_id
      - family_id
      - assignment_id
      - variant
      - template_id
      - template_version
      - expected_page_count
      - tasks
    VariantInput:
      type: object
      properties:
        existing_work_id: *id004
        variant:
          type: string
          pattern: ^[0-9]+$
        template_id: *id002
        template_version:
          type: integer
